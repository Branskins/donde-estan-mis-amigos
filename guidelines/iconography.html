<!-- @dsCard group="Icons" viewport="700x220" subtitle="Lucide line icons via CDN, 2px stroke, technical/minimal" name="Iconography" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-mono)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin-bottom:16px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-secondary);font-size:9px}
.cell i{color:var(--text-primary)}
.note{font-size:10px;color:var(--text-muted);letter-spacing:var(--tracking-wide)}
</style></head><body>
<div class="grid">
<div class="cell"><i data-lucide="terminal"></i>terminal</div>
<div class="cell"><i data-lucide="github"></i>github</div>
<div class="cell"><i data-lucide="arrow-up-right"></i>arrow-up-right</div>
<div class="cell"><i data-lucide="mail"></i>mail</div>
<div class="cell"><i data-lucide="file-text"></i>file-text</div>
<div class="cell"><i data-lucide="folder-git-2"></i>folder-git-2</div>
<div class="cell"><i data-lucide="external-link"></i>external-link</div>
<div class="cell"><i data-lucide="x"></i>x</div>
</div>
<div class="note">// lucide, stroke-width 2, 20–24px, currentColor</div>
<script>lucide.createIcons({ 'stroke-width': 2 });</script>
</body></html>
