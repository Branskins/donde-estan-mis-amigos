<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)}

.bar{background:var(--accent-primary);height:10px}
.tag{width:60px;flex:none}

<div class="row"><div class="tag">space-1</div><div class="bar" style="width:var(--space-1)"></div></div>

<div class="row"><div class="tag">space-4</div><div class="bar" style="width:var(--space-4)"></div></div>
<div class="row"><div class="tag">space-6</div><div class="bar" style="width:var(--space-6)"></div></div>
<div class="row"><div class="tag">space-8</div><div class="bar" style="width:var(--space-8)"></div></div>
<div class="row"><div class="tag">space-12</div><div class="bar" style="width:var(--space-12)"></div></div>
<div class="row"><div class="tag">space-16</div><div class="bar" style="width:var(--space-16)"></div></div>
</body></html>
