<!-- @dsCard group="Spacing" viewport="700x200" subtitle="Sharp corners, hairline borders, minimal elevation" name="Radius, Border & Shadow" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-mono);font-size:9px;color:var(--text-muted);display:flex;gap:14px}
.box{width:80px;height:64px;background:var(--white);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
</style></head><body>
<div class="box" style="border:var(--border-hairline) solid var(--border-strong);border-radius:var(--radius-none)">radius-none</div>
<div class="box" style="border:var(--border-hairline) solid var(--border-strong);border-radius:var(--radius-xs)">radius-xs</div>
<div class="box" style="border:var(--border-hairline) solid var(--border-strong);border-radius:var(--radius-sm)">radius-sm</div>
<div class="box" style="border:var(--border-thick) solid var(--border-strong);border-radius:var(--radius-sm)">border-thick</div>
<div class="box" style="box-shadow:var(--shadow-sm);border-radius:var(--radius-sm)">shadow-sm</div>
<div class="box" style="box-shadow:var(--shadow-md);border-radius:var(--radius-sm)">shadow-md</div>
</body></html>
