<!-- @dsCard group="Colors" viewport="700x180" subtitle="High-contrast black/white neutral ramp" name="Neutrals" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-mono)}
.row{display:flex;gap:6px}
.sw{flex:1;height:64px;border-radius:var(--radius-xs);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:9px;letter-spacing:var(--tracking-wide);border:var(--border-hairline) solid var(--border-default)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--white);color:var(--black)">white</div>
<div class="sw" style="background:var(--gray-50);color:var(--black)">50</div>
<div class="sw" style="background:var(--gray-100);color:var(--black)">100</div>
<div class="sw" style="background:var(--gray-200);color:var(--black)">200</div>
<div class="sw" style="background:var(--gray-300);color:var(--black)">300</div>
<div class="sw" style="background:var(--gray-400);color:var(--white)">400</div>
<div class="sw" style="background:var(--gray-500);color:var(--white)">500</div>
<div class="sw" style="background:var(--gray-600);color:var(--white)">600</div>
<div class="sw" style="background:var(--gray-700);color:var(--white)">700</div>
<div class="sw" style="background:var(--gray-800);color:var(--white)">800</div>
<div class="sw" style="background:var(--gray-900);color:var(--white)">900</div>
<div class="sw" style="background:var(--black);color:var(--white)">black</div>
</div>
</body></html>
