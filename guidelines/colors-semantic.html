<!-- @dsCard group="Colors" viewport="700x260" subtitle="Surface, text, border and state aliases" name="Semantic Tokens" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-mono);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{border:var(--border-hairline) solid var(--border-default);border-radius:var(--radius-xs);padding:10px;display:flex;flex-direction:column;gap:8px}
.chip{height:32px;border-radius:var(--radius-xs);border:var(--border-hairline) solid var(--border-default)}
.name{color:var(--text-secondary);letter-spacing:var(--tracking-wide)}
</style></head><body>
<div class="grid">
<div class="cell"><div class="chip" style="background:var(--surface-page)"></div><div class="name">surface-page</div></div>
<div class="cell"><div class="chip" style="background:var(--surface-sunken)"></div><div class="name">surface-sunken</div></div>
<div class="cell"><div class="chip" style="background:var(--surface-inverse)"></div><div class="name">surface-inverse</div></div>
<div class="cell"><div class="chip" style="background:var(--accent-primary)"></div><div class="name">accent-primary</div></div>
<div class="cell"><div class="chip" style="background:var(--accent-secondary)"></div><div class="name">accent-secondary</div></div>
<div class="cell"><div class="chip" style="background:var(--text-primary)"></div><div class="name">text-primary</div></div>
<div class="cell"><div class="chip" style="background:var(--text-secondary)"></div><div class="name">text-secondary</div></div>
<div class="cell"><div class="chip" style="background:var(--border-strong)"></div><div class="name">border-strong</div></div>
</div>
</body></html>
