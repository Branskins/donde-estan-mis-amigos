<!-- @dsCard group="Colors" viewport="700x220" subtitle="Signal orange primary, circuit blue secondary" name="Primary & Secondary" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-mono)}
.row{display:flex;gap:10px}
.sw{flex:1;height:76px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;color:var(--white);font-size:10px;letter-spacing:var(--tracking-wide)}
.grp{margin-bottom:16px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:var(--tracking-widest);color:var(--text-muted);margin-bottom:6px}
</style></head><body>
<div class="grp"><div class="lbl">Primary — Orange</div><div class="row">
<div class="sw" style="background:var(--orange-50);color:var(--black)">50</div>
<div class="sw" style="background:var(--orange-100);color:var(--black)">100</div>
<div class="sw" style="background:var(--orange-300)">300</div>
<div class="sw" style="background:var(--orange-500)">500</div>
<div class="sw" style="background:var(--orange-600)">600</div>
<div class="sw" style="background:var(--orange-700)">700</div>
</div></div>
<div class="grp"><div class="lbl">Secondary — Blue</div><div class="row">
<div class="sw" style="background:var(--blue-50);color:var(--black)">50</div>
<div class="sw" style="background:var(--blue-100);color:var(--black)">100</div>
<div class="sw" style="background:var(--blue-300)">300</div>
<div class="sw" style="background:var(--blue-500)">500</div>
<div class="sw" style="background:var(--blue-600)">600</div>
<div class="sw" style="background:var(--blue-700)">700</div>
</div></div>
</body></html>
